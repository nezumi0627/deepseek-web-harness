<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek Web Harness</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e8edf2;background:#0b0e11;color-scheme:dark;--panel:#13181d;--panel2:#101419;--line:#29323a;--muted:#93a0aa;--accent:#55b7d9;--good:#70cf9b;--bad:#ff8e8e}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#182128;padding:8px 11px;border-radius:5px}button:hover{border-color:var(--accent)}button.primary{background:#2b768f;border-color:#55b7d9;font-weight:650}button.danger{color:#ffb0b0}.app{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;height:100vh}.sidebar,.inspector{background:var(--panel2);border-color:var(--line);padding:18px;overflow:auto}.sidebar{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}h1{font-size:16px;margin:0 0 4px;letter-spacing:.02em}h2{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.12em;margin:24px 0 10px}.sub{font-size:12px;color:var(--muted)}.session-list{display:grid;gap:5px;margin-top:14px}.session{display:block;text-align:left;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:transparent;color:#cbd4da}.session.active{border-color:var(--accent);background:#162832}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;background:#0e1216}.topbar{border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.status{font-size:12px;color:var(--good)}.messages{overflow:auto;padding:26px clamp(18px,6vw,90px);display:grid;align-content:start;gap:20px}.empty{color:var(--muted);text-align:center;margin-top:20vh}.msg{max-width:820px;border-left:2px solid var(--line);padding:2px 0 2px 14px;white-space:pre-wrap;line-height:1.65}.msg.user{border-color:#4d7685}.msg.assistant{border-color:var(--accent)}.role{font-size:11px;color:var(--muted);margin-bottom:5px}.thinking{color:#aab6bd;background:#111920;border:1px solid var(--line);padding:10px;margin:8px 0;font-size:12px;white-space:pre-wrap}.composer{border-top:1px solid var(--line);padding:15px 22px;background:var(--panel)}textarea{width:100%;min-height:76px;resize:vertical;background:#0b0f13;border:1px solid var(--line);border-radius:5px;padding:11px;outline:none}textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:2px solid #55b7d933}.compose-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}.hint{font-size:11px;color:var(--muted)}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;padding:8px;background:#0b0f13;border:1px solid var(--line);border-radius:4px}.checks{display:grid;gap:8px;font-size:13px}.checks label{display:flex;gap:8px;align-items:center}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{border:1px solid var(--line);padding:9px;border-radius:4px;background:#11171c}.metric b{display:block;font-size:16px}.metric span{font-size:10px;color:var(--muted)}.error{color:var(--bad);font-size:12px;white-space:pre-wrap}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.mobile-toggle{display:none}@media(max-width:900px){.app{grid-template-columns:190px minmax(0,1fr)}.inspector{display:none}}@media(max-width:620px){.app{display:block}.sidebar{height:180px;border-right:0;border-bottom:1px solid var(--line)}.main{height:calc(100vh - 180px)}.mobile-toggle{display:block}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><h1>DeepSeek Web Harness</h1><div class="sub">Local browser bridge</div><button class="primary" id="newSession">＋ 新しいチャット</button><h2>Sessions</h2><div id="sessions" class="session-list"></div></aside>
    <main class="main"><header class="topbar"><div><strong id="title">Harness chat</strong><div id="sessionId" class="sub"></div></div><div class="toolbar"><span id="status" class="status">ready</span><button id="fork">Fork</button><button id="compact">Compact</button></div></header><section id="messages" class="messages"><div class="empty">DeepSeek に質問してください</div></section><form id="composer" class="composer"><textarea id="prompt" aria-label="メッセージ" placeholder="メッセージを入力… (Ctrl+Enterで送信)"></textarea><div class="compose-row"><span class="hint">/help は harness、設定は右パネル</span><button class="primary" id="send">送信</button></div></form></main>
    <aside class="inspector"><h2>DeepSeek</h2><div class="field"><label for="language">回答言語</label><input id="language" value="Japanese" placeholder="例: Japanese"></div><div class="field"><label for="mode">モード</label><select id="mode"><option value="">Default</option><option>instant</option><option>expert</option><option>imageRecognition</option></select></div><div class="checks"><label><input id="think" type="checkbox"> DeepThink</label><label><input id="search" type="checkbox"> Smart Search</label><label><input id="tools" type="checkbox"> Local tools (明示許可)</label><label><input id="stream" type="checkbox" checked> ストリーム表示</label></div><div class="field"><label for="skills">Skills (comma separated)</label><input id="skills" placeholder="concise"></div><div class="field"><label for="attachment">添付ファイルのサーバー上パス</label><input id="attachment" placeholder="C:\\path\\file.pdf"></div><h2>Usage / Speed</h2><div class="metrics"><div class="metric"><b id="inputTokens">—</b><span>input tokens≈</span></div><div class="metric"><b id="outputTokens">—</b><span>output tokens≈</span></div><div class="metric"><b id="totalTokens">—</b><span>session total≈</span></div><div class="metric"><b id="speed">—</b><span>chars / sec</span></div></div><h2>Session</h2><div class="toolbar"><button id="rename">Rename</button><button class="danger" id="remove">Delete</button></div><div id="error" class="error" role="alert"></div></aside>
  </div>
  <script>
    const $=id=>document.getElementById(id); let session=null, sessions=[];
    async function api(path,opt={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});if(!r.ok){let e=await r.json().catch(()=>({}));throw new Error(e.error?.message||e.error||`HTTP ${r.status}`)}return r.status===204?null:r.json()}
    function showError(e){$('error').textContent=e?.message||'';$('status').textContent=e?'error':'ready'}
    function render(){ $('title').textContent=session?.title||'Harness chat';$('sessionId').textContent=session?.id||''; $('messages').innerHTML=''; if(!session?.messages?.length){$('messages').innerHTML='<div class="empty">DeepSeek に質問してください</div>';return} for(const m of session.messages){const el=document.createElement('article');el.className=`msg ${m.role}`;el.innerHTML=`<div class="role">${m.role==='user'?'You':'DeepSeek'}</div>`;el.append(document.createTextNode(m.content));$('messages').append(el)} $('messages').scrollTop=$('messages').scrollHeight}
    async function loadSessions(){sessions=(await api('/v1/sessions')).data; $('sessions').innerHTML='';for(const s of sessions){const b=document.createElement('button');b.className=`session ${s.id===session?.id?'active':''}`;b.textContent=s.title;b.title=s.id;b.onclick=()=>{session=s;render();loadSessions()};$('sessions').append(b)}}
    async function newSession(){session=await api('/v1/sessions',{method:'POST',body:JSON.stringify({title:'Harness chat'})});render();loadSessions()}
    async function send(){const text=$('prompt').value.trim();if(!text||!session)return;$('prompt').value='';showError();$('status').textContent='waiting';const started=performance.now();session.messages.push({role:'user',content:text});render();const ext={session_id:session.id,language:$('language').value||undefined,mode:$('mode').value||undefined,deep_think:$('think').checked,search:$('search').checked,local_tools:$('tools').checked,skills:$('skills').value.split(',').map(x=>x.trim()).filter(Boolean),attachments:$('attachment').value?[$('attachment').value]:undefined};const body={model:'deepseek-web',messages:[{role:'user',content:text}],deepseek_web:ext};try{const r=await api('/v1/chat/completions',{method:'POST',body:JSON.stringify(body)});const answer=r.choices?.[0]?.message?.content||'';session=await api(`/v1/sessions/${r.deepseek_web.session_id}`);const elapsed=Math.max(1,(performance.now()-started)/1000);$('inputTokens').textContent=r.usage?.prompt_tokens??'—';$('outputTokens').textContent=r.usage?.completion_tokens??'—';$('totalTokens').textContent=session.usage?.totalTokens??'—';$('speed').textContent=(answer.length/elapsed).toFixed(1);$('status').textContent='ready';const m=session.messages.at(-1);if($('stream').checked){session.messages.pop();render();const el=document.createElement('article');el.className='msg assistant';el.innerHTML='<div class="role">DeepSeek</div>';const node=document.createTextNode('');el.append(node);$('messages').append(el);for(const ch of answer.match(/.{1,18}/gs)||[]){node.data+=ch;await new Promise(x=>setTimeout(x,12))}}render();loadSessions()}catch(e){session.messages.pop();render();showError(e)}}
    $('composer').onsubmit=e=>{e.preventDefault();send()};$('prompt').onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();send()}};$('newSession').onclick=newSession;$('fork').onclick=async()=>{try{session=await api(`/v1/sessions/${session.id}/fork`,{method:'POST'});render();loadSessions()}catch(e){showError(e)}};$('compact').onclick=async()=>{try{session=await api(`/v1/sessions/${session.id}/compact`,{method:'POST'});render()}catch(e){showError(e)}};$('rename').onclick=async()=>{const title=prompt('新しいセッション名',session.title);if(title){session=await api(`/v1/sessions/${session.id}`,{method:'PATCH',body:JSON.stringify({title})});render();loadSessions()}};$('remove').onclick=async()=>{if(confirm('この session を削除しますか？')){await api(`/v1/sessions/${session.id}`,{method:'DELETE'});await newSession()}};
    (async()=>{try{await loadSessions();session=sessions[0]||await api('/v1/sessions',{method:'POST',body:JSON.stringify({title:'Harness chat'})});render();loadSessions()}catch(e){showError(e)}})();
  </script>
</body></html>
